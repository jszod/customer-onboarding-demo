[project]
name = "customer-onboarding-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdf>=4.2",
    "reportlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
