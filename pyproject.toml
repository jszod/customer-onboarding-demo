[project]
name = "customer-onboarding-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdf>=7.0.0,<8",
    "reportlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
# Security floors for packages we only get transitively (R-042): Pillow via
# reportlab, certifi via httpx. A constraint pins the floor without making
# either a direct dependency, so a re-lock cannot slide back below the fix.
constraint-dependencies = [
    "pillow>=13.0.0",
    "certifi>=2026.10.18",
]
